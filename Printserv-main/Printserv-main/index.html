// ── Inline DB (localStorage for preview/browser, SQLite when in APK) ──
function genId() { return "r-" + Date.now() + "-" + Math.random().toString(36).slice(2,9); }
const DB_KEY = "printserv_v5";
const db = {
  init: async function() { return true; },
  getReports: async function() {
    try { const s = localStorage.getItem(DB_KEY); return s ? JSON.parse(s) : []; } catch(e) { return []; }
  },
  saveReport: async function(report) {
    try {
      const all = await db.getReports();
      const id  = report.id || genId();
      const now = new Date().toISOString();
      const rec = {...report, id, updatedAt:now, createdAt: report.createdAt || now};
      const idx = all.findIndex(function(r){ return r.id===id; });
      if (idx>=0) all[idx]=rec; else all.unshift(rec);
      localStorage.setItem(DB_KEY, JSON.stringify(all));
      return rec;
    } catch(e) { return report; }
  },
  deleteReport: async function(id) {
    try {
      const all = (await db.getReports()).filter(function(r){ return r.id!==id; });
      localStorage.setItem(DB_KEY, JSON.stringify(all));
    } catch(e) {}
  },
};

function BarChart({reports}) {
  const months = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date();
    d.setMonth(d.getMonth() - i);
    const key = d.toISOString().slice(0,7);
    const label = d.toLocaleDateString("en-US", {month:"short"});
    const rev = reports.filter(r => r.arrivedDate && r.arrivedDate.startsWith(key)).reduce((s,r) => s+calcNum(r), 0);
    months.push({label, rev, cur: i===0});
  }
  const maxR = Math.max(...months.map(m => m.rev), 1);
  return (
    <div style={{display:"flex",alignItems:"flex-end",gap:8,height:110,marginTop:8}}>
      {months.map(function(m, i) {
        return (
          <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
            <div style={{fontSize:9,fontWeight:700,color:m.cur?"#FF6B2B":"#475569"}}>{m.rev>0 ? Math.round(m.rev/1000)+"k" : ""}</div>
            <div style={{width:"100%",borderRadius:"4px 4px 0 0",background:m.cur?"#FF6B2B":"#e2e8f0",height:Math.max((m.rev/maxR)*80, m.rev>0?6:2)}}/>
            <div style={{fontSize:10,fontWeight:m.cur?700:400,color:m.cur?"#FF6B2B":"#475569"}}>{m.label}</div>
          </div>
        );
      })}
    </div>
  );
}

  const total = wCount + owCount;
  const wP = total === 0 ? 50 : (wCount / total) * 100;

  const circ = 2 * Math.PI * r2;
  const wD = (wP / 100) * circ;

    <div style={{display:"flex",alignItems:"center",gap:20}}>
      <svg width={108} height={108} viewBox="0 0 108 108" style={{flexShrink:0}}>

        <circle cx={54} cy={54} r={r2} fill="none" stroke="#f59e0b" strokeWidth={14}
          strokeDasharray={(circ-wD) + " " + wD} strokeLinecap="round"

// ── Barcode Scanner ──────────────────────────────────────────────
function BarcodeScanner({ onScan, onClose }) {
  const [status, setStatus]   = React.useState("loading"); // loading | scanning | error
  const [errorMsg, setErrorMsg] = React.useState("");
  const scannerRef = React.useRef(null);
  const divId      = "barcode-scanner-div";

  React.useEffect(function() {
    let scanner = null;

    function loadScript(src) {
      return new Promise(function(resolve, reject) {
        if (document.querySelector('script[src="' + src + '"]')) { resolve(); return; }
        const s = document.createElement("script");
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    async function start() {
      try {
        await loadScript("https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js");

        scanner = new window.Html5Qrcode(divId);
        scannerRef.current = scanner;

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: { width: 260, height: 120 }, supportedScanTypes: [0, 1] },
          function(text) {
            scanner.stop().catch(function(){});
            onScan(text);
          },
          function() {} // ignore parse errors
        );

        setStatus("scanning");
      } catch(err) {
        setStatus("error");
        if (err && err.toString().includes("permission")) {
          setErrorMsg("Camera permission denied. Please allow camera access and try again.");
        } else {
          setErrorMsg("Could not open camera. Please make sure no other app is using it.");
        }
      }
    }

    start();

    return function() {
      if (scannerRef.current) {
        scannerRef.current.stop().catch(function(){});
      }
    };
  }, []);

  function handleClose() {
    if (scannerRef.current) {
      scannerRef.current.stop().catch(function(){});
    }
    onClose();
  }

  return (
    <div style={{position:"fixed",inset:0,zIndex:300,background:"#000",display:"flex",flexDirection:"column"}}>
      {/* Header */}
      <div style={{padding:"16px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",background:"rgba(0,0,0,0.85)",flexShrink:0}}>
        <div>
          <div style={{fontSize:16,fontWeight:700,color:"#fff"}}>Scan Barcode</div>
          <div style={{fontSize:12,color:"rgba(255,255,255,0.55)",marginTop:2}}>Point at the serial number barcode</div>
        </div>
        <button onClick={handleClose} style={{background:"rgba(255,255,255,0.12)",border:"none",color:"#fff",width:36,height:36,borderRadius:"50%",fontSize:16,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>✕</button>
      </div>

      {/* Scanner area */}
      <div style={{flex:1,position:"relative",overflow:"hidden"}}>

        {/* html5-qrcode mounts here */}
        <div id={divId} style={{width:"100%",height:"100%"}}/>

        {/* Loading spinner */}
        {status === "loading" && (
          <div style={{position:"absolute",inset:0,background:"#111",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
            <div style={{width:44,height:44,border:"3px solid rgba(255,255,255,0.15)",borderTop:"3px solid #FF6B2B",borderRadius:"50%",animation:"bspin 0.8s linear infinite"}}/>
            <div style={{color:"rgba(255,255,255,0.7)",fontSize:14}}>Starting camera…</div>
            <style>{`@keyframes bspin { to { transform:rotate(360deg); } }`}</style>
          </div>
        )}

        {/* Error state */}
        {status === "error" && (
          <div style={{position:"absolute",inset:0,background:"#111",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:16,padding:32,textAlign:"center"}}>
            <div style={{fontSize:52}}>📷</div>
            <div style={{color:"#fff",fontSize:15,fontWeight:600,lineHeight:1.5}}>{errorMsg}</div>
            <button onClick={handleClose} style={{background:"#FF6B2B",border:"none",color:"#fff",padding:"12px 32px",borderRadius:12,fontSize:14,fontWeight:700,cursor:"pointer",marginTop:8}}>Go Back</button>
          </div>
        )}

        {/* Scanning hint overlay */}
        {status === "scanning" && (
          <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"14px 20px",background:"linear-gradient(transparent,rgba(0,0,0,0.7))",textAlign:"center",pointerEvents:"none"}}>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.8)"}}>Hold steady — scanning automatically</div>
          </div>
        )}
      </div>
    </div>
  );
}

// ── Swipeable Chart Card — each one independent ───────────────────
function SwipeChartCard({ title, reports, renderChart, STATUS_MAP }) {
  const now = new Date();
  const [offset, setOffset] = React.useState(0);
  const [anim, setAnim]     = React.useState(null); // null | "left" | "right"
  const cardRef  = React.useRef(null);
  const touchRef = React.useRef({ startX:0, startY:0, locked:null, active:false });

  function getKey(off) {
    const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
    return d.toISOString().slice(0,7);
  }
  function getLabel(off) {
    const d = new Date(now.getFullYear(), now.getMonth() + off, 1);
    return d.toLocaleString("default", { month: "short", year: "numeric" });
  }

  const isNow   = offset === 0;
  const monthKey   = getKey(offset);
  const monthLabel = getLabel(offset);

  const mR = React.useMemo(function() {
    return reports.filter(function(r) {
      return r.arrivedDate && r.arrivedDate.startsWith(monthKey);
    });
  }, [reports, monthKey]);

  function goTo(dir) {
    if (dir === "next" && isNow) return;
    setAnim(dir === "prev" ? "left" : "right");
    setTimeout(function() {
      setOffset(function(o) { return dir === "prev" ? o - 1 : Math.min(o + 1, 0); });
      setAnim(null);
    }, 200);
  }

  // touch
  function onTS(e) {
    const t = touchRef.current;
    t.startX = e.touches[0].clientX;
    t.startY = e.touches[0].clientY;
    t.locked = null; t.active = true;
  }
  function onTM(e) {
    const t = touchRef.current;
    if (!t.active) return;
    const dx = e.touches[0].clientX - t.startX;
    const dy = e.touches[0].clientY - t.startY;
    if (!t.locked && (Math.abs(dx)>6 || Math.abs(dy)>6))
      t.locked = Math.abs(dx)>Math.abs(dy) ? "swipe" : "scroll";
    if (t.locked === "swipe") {
      if (e.cancelable) e.preventDefault();
      if (cardRef.current) cardRef.current.style.transform = "translateX("+dx*0.25+"px)";
    }
  }
  function onTE(e) {
    const t = touchRef.current;
    if (!t.active) { return; } t.active = false;
    if (cardRef.current) cardRef.current.style.transform = "";
    if (t.locked !== "swipe") return;
    const dx = e.changedTouches[0].clientX - t.startX;
    if (dx < -50) goTo("prev");
    else if (dx > 50) goTo("next");
  }
  // mouse
  function onMD(e) {
    const t = touchRef.current;
    t.startX = e.clientX; t.startY = e.clientY;
    t.locked = "swipe"; t.active = true;
  }
  function onMM(e) {
    const t = touchRef.current;
    if (!t.active || t.locked !== "swipe") return;
    const dx = e.clientX - t.startX;
    if (cardRef.current) cardRef.current.style.transform = "translateX("+dx*0.25+"px)";
  }
  function onMU(e) {
    const t = touchRef.current;
    if (!t.active) return; t.active = false;
    if (cardRef.current) cardRef.current.style.transform = "";
    const dx = e.clientX - t.startX;
    if (dx < -50) goTo("prev");
    else if (dx > 50) goTo("next");
  }

  const innerStyle = {
    transition: anim ? "transform .2s ease, opacity .2s ease" : "none",
    transform:  anim === "left"  ? "translateX(-24px)" :
                anim === "right" ? "translateX(24px)" : "translateX(0)",
    opacity: anim ? 0 : 1,
  };

  return (
    <div style={{padding:"0 16px 10px"}}>
      <div ref={cardRef}
        style={{background:"#ffffff",borderRadius:16,border:"1px solid #F5F0EB",boxShadow:"0 2px 8px rgba(0,0,0,.07)",overflow:"hidden",willChange:"transform",userSelect:"none"}}
        onTouchStart={onTS} onTouchMove={onTM} onTouchEnd={onTE}
        onMouseDown={onMD} onMouseMove={onMM} onMouseUp={onMU} onMouseLeave={onMU}>

        {/* Card header */}
        <div style={{padding:"12px 14px 10px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #F5F0EB"}}>
          <div style={{fontSize:11,fontWeight:700,color:"#FF6B2B",letterSpacing:1.4,textTransform:"uppercase"}}>{title}</div>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <button onClick={function(e){e.stopPropagation();goTo("prev");}}
              style={{background:"rgba(255,107,43,0.08)",border:"none",color:"#FF6B2B",width:26,height:26,borderRadius:7,fontSize:14,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>‹</button>
            <div style={{fontSize:11,fontWeight:700,color:isNow?"#FF6B2B":"#64748b",minWidth:72,textAlign:"center"}}>
              {isNow ? "● This Month" : monthLabel}
            </div>
            <button onClick={function(e){e.stopPropagation();goTo("next");}} disabled={isNow}
              style={{background:isNow?"#e2e8f0":"rgba(255,107,43,0.08)",border:"none",color:isNow?"#cbd5e1":"#FF6B2B",width:26,height:26,borderRadius:7,fontSize:14,cursor:isNow?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:700}}>›</button>
          </div>
        </div>

        {/* Chart content */}
        <div style={{padding:14, ...innerStyle}}>
          {mR.length === 0
            ? <div style={{textAlign:"center",padding:"24px 0",color:"#cbd5e1",fontSize:13}}>📭 No data for {monthLabel}</div>
            : renderChart(mR)
          }
        </div>

        {/* Swipe hint */}
        <div style={{textAlign:"center",paddingBottom:8,fontSize:10,color:"#cbd5e1"}}>← swipe →</div>
      </div>
    </div>
  );
}

// ── Monthly Charts wrapper ────────────────────────────────────────
function MonthlyCharts({reports, STATUS_MAP, MACHINE_TYPES}) {

  function SmallDonut({segments, total, label}) {
    const r2=70, cx=90, cy=90, circ=2*Math.PI*r2;
    let cum=0;
    const segs = segments.map(function(s){
      const pct = total===0 ? 0 : s.count/total;
      const dash = pct*circ;
      const off2 = -cum*circ;
      cum += pct;
      return {...s, dash, off2};
    });
    return (
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <svg width={150} height={150} viewBox="0 0 180 180" style={{flexShrink:0}}>
          <circle cx={cx} cy={cy} r={r2} fill="none" stroke="#e2e8f0" strokeWidth={24}/>
          {segs.map(function(s){
            return (
              <circle key={s.label} cx={cx} cy={cy} r={r2} fill="none"
                stroke={s.color} strokeWidth={24}
                strokeDasharray={s.dash+" "+(circ-s.dash)}
                strokeDashoffset={s.off2} strokeLinecap="butt"
                transform={"rotate(-90 "+cx+" "+cy+")"}/>
            );
          })}
          <text x={cx} y={cy-8} textAnchor="middle" fontSize="26" fontWeight="800" fill="#0f172a">{total}</text>
          <text x={cx} y={cy+12} textAnchor="middle" fontSize="11" fill="#94a3b8" fontWeight="600">{label}</text>
        </svg>
        <div style={{flex:1}}>
          {segs.map(function(s){
            const pct = total===0 ? 0 : Math.round(s.count/total*100);
            return (
              <div key={s.label} style={{marginBottom:12}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:3}}>
                  <div style={{width:8,height:8,borderRadius:"50%",background:s.color,flexShrink:0}}/>
                  <span style={{fontSize:12,fontWeight:700,color:"#0f172a",flex:1}}>{s.label}</span>
                  <span style={{fontSize:12,fontWeight:800,color:s.color}}>{s.count}</span>
                </div>
                <div style={{height:4,background:"#e2e8f0",borderRadius:2}}>
                  <div style={{height:4,background:s.color,borderRadius:2,width:pct+"%",transition:"width .4s"}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  return (
    <div style={{paddingBottom:4}}>

      {/* Card 1 — Warranty */}
      <SwipeChartCard
        title="Warranty Overview"
        reports={reports}
        renderChart={function(mR) {
          const wC  = mR.filter(function(r){ return r.warranty==="warranty"; }).length;
          const owC = mR.filter(function(r){ return r.warranty==="over-warranty"; }).length;
          const tot = wC + owC;
          return <SmallDonut total={tot} label="JOBS"
            segments={[{label:"Warranty",color:"#10b981",count:wC},{label:"Over Warranty",color:"#f59e0b",count:owC}].filter(function(d){return d.count>0;})}/>;
        }}
      />

      {/* Card 2 — Small vs Large */}
      <SwipeChartCard
        title="Small vs Large L Series"
        reports={reports}
        renderChart={function(mR) {
          const lR    = mR.filter(function(r){ return r.machineType==="l-series"; });
          const large = lR.filter(function(r){ return /l1[38]\d{2}|l805|l7\d{3}|l15\d{3}/i.test(r.model||""); });
          const small = lR.filter(function(r){ return !/l1[38]\d{2}|l805|l7\d{3}|l15\d{3}/i.test(r.model||""); });
          if (lR.length===0) return <div style={{textAlign:"center",padding:"24px 0",color:"#cbd5e1",fontSize:13}}>No L Series jobs</div>;
          return <SmallDonut total={lR.length} label="L SERIES"
            segments={[{label:"Small (4-colour)",color:"#FF6B2B",count:small.length},{label:"Large (6-colour)",color:"#3b82f6",count:large.length}].filter(function(d){return d.count>0;})}/>;
        }}
      />

      {/* Card 3 — Job Status */}
      <SwipeChartCard
        title="Job Status Overview"
        reports={reports}
        renderChart={function(mR) {
          const data = Object.entries(STATUS_MAP).map(function(e){
            const k=e[0],v=e[1];
            return {label:v.label, color:v.dot, count:mR.filter(function(r){ return (r.status||"in-progress")===k; }).length};
          }).filter(function(d){ return d.count>0; });
          const tot = data.reduce(function(s,d){ return s+d.count; }, 0);
          if (tot===0) return <div style={{textAlign:"center",padding:"24px 0",color:"#cbd5e1",fontSize:13}}>No data</div>;
          return <SmallDonut total={tot} label="TOTAL" segments={data}/>;
        }}
      />

    </div>
  );
}

function App() {

  const [editId, setEditId]     = useState(null);
  const [detailId, setDetailId] = useState(null);
  const [search, setSearch]     = useState("");
  const [wFilter, setWFilter]   = useState("all");
  const [sFilter, setSFilter]   = useState("all");
  const [mFilter, setMFilter]   = useState("all");
  const [dailyDate, setDailyDate] = useState(today());
  const [confirm, setConfirm]   = useState(null);
  const [scanning, setScanning] = useState(false);

  // ── Init DB ─────────────────────────────────
  useEffect(function() {
    db.init().then(function() {
      return db.getReports();
    }).then(function(saved) {
      const hasFullData = saved && saved.length >= 60;
      if (hasFullData) {
        setReports(saved);
      } else {
        const userReports = saved ? saved.filter(function(r){ return !r.id.startsWith("s"); }) : [];
        const merged = [...userReports, ...SAMPLES];
        localStorage.setItem(DB_KEY, JSON.stringify(merged));
        setReports(merged);
      }
    }).catch(function(err) { console.error("DB init error:", err); });
  }, []);

  function persistSave(report) {
    db.saveReport(report).then(function(saved) {
      setReports(function(prev) {
        const idx = prev.findIndex(function(r) { return r.id === saved.id; });
        if (idx >= 0) { const n=[...prev]; n[idx]=saved; return n; }
        return [saved, ...prev];
      });
    }).catch(function(err) { console.error("Save error:", err); });
  }

  function persistDelete(id) {
    db.deleteReport(id).then(function() {
      setReports(function(prev) { return prev.filter(function(r) { return r.id !== id; }); });
    }).catch(function(err) { console.error("Delete error:", err); });
  }

  const thisMonth = new Date().toISOString().slice(0,7);

  const stats = React.useMemo(function() {
    // Revenue: only count completed jobs (money actually received)
    const completedReports = reports.filter(function(r){ return r.status==="completed"; });
    const totalRev  = completedReports.reduce(function(s,r){ return s+calcNum(r); }, 0);
    const wCount    = reports.filter(function(r){ return r.warranty==="warranty"; }).length;
    const owCount   = reports.filter(function(r){ return r.warranty==="over-warranty"; }).length;
    // Monthly: all jobs that arrived this month (for job count)
    const mReports  = reports.filter(function(r){ return r.arrivedDate && r.arrivedDate.startsWith(thisMonth); });
    // Monthly revenue: only completed jobs that were completed this month (outDate this month)
    const mRev      = reports.filter(function(r){ return r.status==="completed" && r.outDate && r.outDate.startsWith(thisMonth); }).reduce(function(s,r){ return s+calcNum(r); }, 0);
    // Active jobs count (in-progress + ready)
    const activeCount = reports.filter(function(r){ return r.status==="in-progress" || r.status==="ready"; }).length;
    // Pending revenue (jobs not yet completed)
    const pendingRev = reports.filter(function(r){ return r.status!=="completed"; }).reduce(function(s,r){ return s+calcNum(r); }, 0);
    return {totalRev, wCount, owCount, mReports, mRev, activeCount, pendingRev};
  }, [reports, thisMonth]);

  const {totalRev, wCount, owCount, mReports, mRev, activeCount, pendingRev} = stats;

  const dReports  = React.useMemo(function() {
    return reports.filter(function(r){ return r.arrivedDate===dailyDate || r.outDate===dailyDate; });
  }, [reports, dailyDate]);

  const dRev = React.useMemo(function() {
    return dReports.filter(function(r){ return r.outDate===dailyDate && r.status==="completed"; }).reduce(function(s,r){ return s+calcNum(r); }, 0);
  }, [dReports, dailyDate]);

  const filtered = React.useMemo(function() {
    return reports.filter(function(r) {
      const q = search.toLowerCase();
      const ms = r.customerName.toLowerCase().includes(q) || r.model.toLowerCase().includes(q) ||
        (r.ccc && r.ccc.includes(q)) || (r.serialNumber && r.serialNumber.toLowerCase().includes(q)) ||
        (r.phone && r.phone.includes(q));
      return ms && (wFilter==="all" || r.warranty===wFilter) && (sFilter==="all" || r.status===sFilter) && (mFilter==="all" || r.machineType===mFilter);
    });
  }, [reports, search, wFilter, sFilter, mFilter]);

  const sel = reports.find(function(r){ return r.id===detailId; });

    const m = model.toLowerCase();
    if (/\bl[\d]/.test(m) || /l-\d|l\d{3,4}/.test(m)) return "l-series";
    if (/lq[\s-]?\d|lq\d/.test(m)) return "lq-series";
    if (/tm[\s-]?\d|tm\d|receipt|pos/.test(m)) return "tm-series";
    if (/eb[\s-]|eh[\s-]|emp[\s-]|project|epson\s*proj/.test(m)) return "projector";

                  style={{opacity:0,position:"absolute",right:18,top:24,width:120,height:40,cursor:"pointer"}}/>
              </div>

              {/* ── Weekly calendar strip — pills, no card, full width ── */}
              <div style={{display:"flex",gap:6,padding:"0 16px 20px"}}>
                {weekDays.map(function(day,i){
                  const isSelected = day===dailyDate;
                  const isToday = day===today();
                  const hasJobs = reports.some(function(r){ return r.arrivedDate===day||r.outDate===day; });
                  const d = new Date(day+"T00:00:00");
                  return (
                    <div key={day} onClick={function(){ setDailyDate(day); }}
                      style={{
                        flex:1,
                        display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",
                        padding:"12px 0 10px",
                        borderRadius:50,
                        cursor:"pointer",
                        background: isSelected
                          ? "linear-gradient(170deg,#FF6B2B,#c94a14)"
                          : isToday ? "rgba(255,107,43,.15)" : "rgba(255,255,255,.06)",
                        border: isSelected ? "none"
                          : isToday ? "1.5px solid rgba(255,107,43,.5)"
                          : "1.5px solid rgba(255,255,255,.07)",
                        boxShadow: isSelected ? "0 6px 20px rgba(255,107,43,.45)" : "none",
                        transition:"background .2s ease, box-shadow .2s ease, transform .15s ease",
                        transform: isSelected ? "scale(1.06)" : "scale(1)",
                      }}>
                      <span style={{
                        fontSize:9,fontWeight:700,letterSpacing:.8,marginBottom:5,
                        color:isSelected?"rgba(255,255,255,.7)":isToday?"#FF6B2B":"#475569",
                        textTransform:"uppercase",transition:"color .2s"
                      }}>
                        {DAY_LABELS[i]}
                      </span>
                      <span style={{
                        fontSize:18,fontWeight:isSelected?900:500,lineHeight:1,
                        color:isSelected?"#fff":isToday?"#FF6B2B":"#64748b",
                        transition:"color .2s, font-weight .2s"
                      }}>
                        {d.getDate()}
                      </span>
                      <div style={{height:6,marginTop:5,display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {hasJobs
                          ? <div style={{width:5,height:5,borderRadius:"50%",background:isSelected?"rgba(255,255,255,.85)":"#FF6B2B",transition:"background .2s"}}/>
                          : <div style={{width:5,height:5}}/>
                        }
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* ── Stats row ── */}
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,margin:"0 16px 14px"}}>
                <div style={{background:"rgba(255,255,255,.07)",borderRadius:16,padding:"16px",border:"1px solid rgba(255,255,255,.07)"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#475569",letterSpacing:1.2,marginBottom:8,textTransform:"uppercase"}}>Jobs</div>
                  <div style={{fontSize:30,fontWeight:900,color:"#f8fafc",lineHeight:1}}>{dReports.length}</div>
                  <div style={{fontSize:11,color:"#475569",marginTop:6}}>{dReports.filter(function(r){return r.arrivedDate===dailyDate;}).length} in · {dReports.filter(function(r){return r.outDate===dailyDate;}).length} out</div>
                </div>
                <div style={{background:"rgba(52,211,153,.1)",borderRadius:16,padding:"16px",border:"1px solid rgba(52,211,153,.15)"}}>
                  <div style={{fontSize:10,fontWeight:700,color:"#34d399",letterSpacing:1.2,marginBottom:8,textTransform:"uppercase",opacity:.8}}>Revenue</div>
                  <div style={{fontSize:24,fontWeight:900,color:"#34d399",lineHeight:1}}>{dRev.toLocaleString()}</div>
                  <div style={{fontSize:11,color:"#34d399",marginTop:6,opacity:.6}}>MMK collected</div>
                </div>
              </div>

              {/* ── Jobs list ── */}
              {dReports.length===0 ? (
                <div style={{textAlign:"center",padding:"40px 24px"}}>
                  <div style={{fontSize:48,marginBottom:10}}>📭</div>
                  <div style={{fontSize:16,fontWeight:700,color:"#64748b",marginBottom:4}}>No jobs on this date</div>
                  <div style={{fontSize:12,color:"#475569"}}>Tap another day above</div>
                </div>
              ) : (
                <div>
                  <div style={{padding:"0 16px",fontSize:11,fontWeight:700,color:"#475569",letterSpacing:1.5,textTransform:"uppercase",marginBottom:8}}>
                    {dReports.length} Job{dReports.length!==1?"s":""} · {dailyDate}
                  </div>
                  {dReports.map(function(r){
                    const s = STATUS_MAP[r.status]||STATUS_MAP["in-progress"];
                    return (
                      <div key={r.id}
                        onClick={function(){ goDetail(r.id); }}
                        style={{margin:"0 16px 10px",borderRadius:20,background:"rgba(255,255,255,.06)",border:"1px solid rgba(255,255,255,.08)",cursor:"pointer",WebkitTapHighlightColor:"transparent"}}>
                        <div style={{padding:"14px 16px"}}>
                          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:10}}>
                            <div style={{width:42,height:42,borderRadius:"50%",background:"linear-gradient(135deg,"+s.accent+"40,"+s.accent+"18)",border:"2px solid "+s.accent+"44",display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:16,color:s.accent,flexShrink:0}}>
                              {r.customerName.charAt(0).toUpperCase()}
                            </div>
                            <div style={{flex:1,minWidth:0}}>
                              <div style={{fontWeight:700,fontSize:14,color:"#f1f5f9",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{r.customerName}</div>
                              <div style={{fontSize:11,color:"#475569",marginTop:2}}>{r.model}{r.ccc?" · CCC: "+r.ccc:""}</div>
                            </div>
                            <div style={{textAlign:"right",flexShrink:0}}>
                              <div style={{fontWeight:900,color:"#f1f5f9",fontSize:15,letterSpacing:-.3}}>{calcTotal(r)}</div>
                              <div style={{fontSize:10,color:"#475569",marginTop:1}}>MMK</div>
                            </div>
                          </div>
                          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                            <StatusPill status={r.status||"in-progress"} small={true}/>
                            <div style={{display:"flex",gap:6}}>
                              {r.arrivedDate===dailyDate && <span style={{fontSize:10,color:"#94a3b8",background:"rgba(255,255,255,.07)",padding:"3px 9px",borderRadius:20,fontWeight:600}}>📥 In</span>}
                              {r.outDate===dailyDate && <span style={{fontSize:10,color:"#34d399",background:"rgba(52,211,153,.12)",padding:"3px 9px",borderRadius:20,fontWeight:600}}>📤 Out</span>}
                            </div>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })()}

        {/* BACKUP */}
        {view==="backup" && (
          <div style={{paddingBottom:90,background:"#f1f5f9",minHeight:"100%"}}>

            {/* ── Data Security Card ── */}
            <div style={{margin:"16px 16px 12px",background:"#ffffff",borderRadius:20,padding:"32px 24px 24px",boxShadow:"0 1px 6px rgba(0,0,0,.06)",textAlign:"center"}}>

              {/* Icon */}
              <div style={{width:72,height:72,borderRadius:"50%",background:"#eff6ff",display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 20px"}}>
                <svg width={34} height={34} viewBox="0 0 24 24" fill="none" stroke="#3b82f6" strokeWidth={1.75} strokeLinecap="round" strokeLinejoin="round">
                  <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
                  <path d="M17 21v-8H7v8M7 3v5h8"/>
                </svg>
              </div>

              <div style={{fontSize:20,fontWeight:800,color:"#0f172a",marginBottom:10}}>Data Security</div>
              <div style={{fontSize:14,color:"#94a3b8",lineHeight:1.6,marginBottom:28}}>Download your service history as a backup file or restore data from a previous backup.</div>

              {/* Export button */}
              <button
                onClick={function(){
                  const blob = new Blob([JSON.stringify(reports,null,2)],{type:"application/json"});
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement("a");
                  a.href=url; a.download="printserv-backup-"+new Date().toISOString().slice(0,10)+".json"; a.click();
                  URL.revokeObjectURL(url);
                  localStorage.setItem("printserv_lastbackup",new Date().toLocaleDateString());
                  alert("Backup downloaded! ("+reports.length+" reports)");
                }}
                style={{width:"100%",padding:"16px",borderRadius:14,border:"none",background:"#0f172a",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:10,marginBottom:12}}>
                <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export Data
              </button>

              {/* Import button */}
              <label style={{width:"100%",padding:"16px",borderRadius:14,border:"1.5px solid #e2e8f0",background:"#fff",color:"#0f172a",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit",display:"flex",alignItems:"center",justifyContent:"center",gap:10,boxSizing:"border-box"}}>
                <svg width={18} height={18} viewBox="0 0 24 24" fill="none" stroke="#0f172a" strokeWidth={2} strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 5 17 10"/><line x1="12" y1="5" x2="12" y2="17"/></svg>
                Import Data
                <input type="file" accept=".json" style={{display:"none"}} onChange={function(e){
                  const f = e.target.files[0]; if(!f) return;
                  const reader = new FileReader();
                  reader.onload = function(ev){
                    try {
                      const d = JSON.parse(ev.target.result);
                      if(!Array.isArray(d)) { alert("Invalid file."); return; }
                      setReports(d);
                      alert("Restore successful! "+d.length+" reports loaded.");
                    } catch(err) { alert("Could not read file."); }
                  };
                  reader.readAsText(f);
                  e.target.value = "";
                }}/>
              </label>
            </div>

            {/* ── Danger Zone ── */}
            <div style={{margin:"0 16px 12px",background:"#fff0f0",borderRadius:20,padding:"20px 24px"}}>
              <div style={{fontSize:11,fontWeight:800,color:"#f43f5e",letterSpacing:2,textTransform:"uppercase",textAlign:"center",marginBottom:14}}>Danger Zone</div>
              <button
                onClick={function(){
                  setConfirm({title:"Clear All Database",msg:"This will permanently delete all "+reports.length+" reports. This cannot be undone.",onOk:function(){ setReports([]); }});
                }}
                style={{width:"100%",padding:"16px",borderRadius:14,border:"none",background:"#f43f5e",color:"#fff",fontWeight:700,fontSize:15,cursor:"pointer",fontFamily:"inherit"}}>
                Clear All Database
              </button>
            </div>

          </div>
        )}
      </div>

      {/* Bottom nav — Trantor floating dark pill */}
      {isMain && (
        <div style={{background:"#0f172a",display:"flex",flexShrink:0,padding:"8px 12px 20px",gap:4}}>
          {[
            {v:"list",      ico:<IcoList  c={view==="list"?"#FF6B2B":"#475569"}/>,      label:"Jobs"},
            {v:"dashboard", ico:<IcoGrid  c={view==="dashboard"?"#FF6B2B":"#475569"}/>, label:"Stats"},
            {v:"__fab__",   ico:null, label:""},
            {v:"daily",     ico:<IcoCal  c={view==="daily"?"#FF6B2B":"#475569"}/>,     label:"Daily"},
            {v:"backup",    ico:<IcoSave c={view==="backup"?"#FF6B2B":"#475569"}/>,    label:"Backup"},
          ].map(function(item){
            if(item.v==="__fab__") return (
              <div key="fab" style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
                <button onClick={goNew} style={{width:52,height:52,borderRadius:16,background:"linear-gradient(135deg,#FF6B2B,#e85520)",border:"3px solid #0f172a",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 20px rgba(255,107,43,.6)",marginBottom:8}}>
                  <IcoPlus/>
                </button>
              </div>
            );
            const active = view===item.v;
            return (
              <button key={item.v} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",paddingTop:6,background:"transparent",border:"none",cursor:"pointer",fontFamily:"inherit",gap:4}} onClick={function(){ navTo(item.v); }}>
                <div style={{width:40,height:34,borderRadius:12,background:active?"rgba(255,107,43,.18)":"transparent",display:"flex",alignItems:"center",justifyContent:"center",transition:"background .15s"}}>
                  {item.ico}
                </div>
                <span style={{fontSize:10,fontWeight:active?700:400,color:active?"#FF6B2B":"#475569",letterSpacing:.3}}>{item.label}</span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}


    // Mount the app
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- Service Worker registration for offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('sw.js')
          .then(function(reg) { console.log('SW registered'); })
          .catch(function(err) { console.log('SW failed:', err); });
      });
    }
  </script>
</body>
</html>
